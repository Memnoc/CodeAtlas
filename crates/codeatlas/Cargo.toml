[package]
name = "codeatlas"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.26.12"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[features]
# Compiles the offline fake/fail enrichment providers used at the provider
# seam in tests. Enabled only for test builds through the self
# dev-dependency below, so shipped binaries carry no test machinery.
test-provider = []

[dev-dependencies]
assert_cmd = "2.2.2"
# Self dev-dependency: turns on `test-provider` for every `cargo test`
# build (including the binary assert_cmd runs) without shipping it.
codeatlas = { path = ".", features = ["test-provider"] }
jsonschema = "0.49.8"
predicates = "3.1.3"
tempfile = "3.27.0"
